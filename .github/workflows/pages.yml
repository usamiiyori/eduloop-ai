name: Deploy 承認画面 (GitHub Pages)

# web/review/ を編集して master に push すると自動でGitHub Pagesに公開される。
# 事前に1回だけ GitHub リポジトリの Settings > Pages > Build and deployment > Source を
# 「GitHub Actions」に設定しておく必要がある（docs/運用マニュアル.md 参照）。

on:
  push:
    branches: [master]
    paths:
      - "web/review/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/review
      - id: deployment
        uses: actions/deploy-pages@v4
