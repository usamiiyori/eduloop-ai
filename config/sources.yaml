# 収集ソースレジストリ + ライセンス台帳（CLAUDE.md 第4章 / docs/ARCHITECTURE.md 第1・5章）。
#
# ソースを追加する場合は、このファイルに1エントリ追記するだけでよい（コード変更不要）。
# 各フィールドは src/models/source.py の SourceConfig で検証される。
#
# license / redistribution の初期値について（重要・Phase 1時点の状況）:
#   - 文部科学省(mext_press, mext_chuokyoshin)のみ、公式ページで
#     「政府標準利用規約(第2.0版)」採用を直接確認できたため full_allowed とした。
#     ただし2024年7月にデジタル庁が後継の「公共データ利用規約(第1.0版)」を策定しており、
#     個別サイトが移行済みかは未確認（Phase 2でのスクレイパー実装前に再確認すること）。
#   - それ以外の全ソースは、個別の利用規約ページを未確認のため license: unconfirmed とし、
#     安全側に倒して redistribution: quote_only（quote_max_ratio: 0.1）を暫定設定している。
#     「推測でコードを書かない」原則（CLAUDE.md 第0章）に基づく。Phase 2着手前に1件ずつ
#     公式の利用規約ページを確認し、確認済みのものから license/redistribution を更新すること。
#   - arXiv は論文ごとにライセンスが異なるため、ここでは axis=c_global_academic の代表エントリ
#     のみを置き、実際の論文単位のライセンス判定は scrapers 実装時に個別取得する
#     （docs/ARCHITECTURE.md 第5章）。

