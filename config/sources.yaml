- id: arxiv_cs_cy_education
  name: arXiv cs.CY / cs.HC / cs.AI（教育関連）
  axis: c_global_academic
  fetch_type: rss
  url: http://export.arxiv.org/rss/cs.CY
  license: arxiv-varies
  attribution_required: true
  redistribution: quote_only
  quote_max_ratio: 0.1
  crawl_interval_seconds: 3
  robots_txt_override: true
  override_justification: >
    export.arxiv.org/robots.txt は User-agent:* に Disallow:/ を設定しているが、これは
    汎用検索エンジンのインデックス化を避けるための設定。arXiv公式API利用規約
    (https://info.arxiv.org/help/api/tou.html, 2026-08-18確認)で「3秒に1回・単一接続まで」
    のレート制限を守ることを条件にプログラムからのアクセスを明示的に許可している。
    本レジストリの crawl_interval_seconds もこの規約に合わせて3秒に設定する。
  notes: >
    論文ごとにライセンスが異なる(arXiv perpetual license / CC BY / CC BY-NC-ND等)。
    CC BY-NC-ND の論文は図表転載禁止(docs/ARCHITECTURE.md 第5章)。取得時に論文単位で
    ライセンスを再判定するロジックをPhase2 scrapersに実装すること。メタデータはCC0。
    論文本体(PDF)の再配布は権利者許可がない限り不可(ToU確認済み)。

